version: '3.8'

services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: prime_stroi_web
    restart: always
    expose:
      - "80"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PYTHONUNBUFFERED=1

  caddy:
    image: caddy:latest
    container_name: prime_stroi_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
